name: Send Emails Daily

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install anthropic
      - name: Send emails
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python scripts/send_emails.py
      - name: Commit updates
        run: |
          git config user.name "LeadFlow Bot"
          git config user.email "bot@leadflow.ai"
          git add leads.json
          git diff --staged --quiet || git commit -m "Auto: emails sent $(date +%Y-%m-%d)"
          git push
