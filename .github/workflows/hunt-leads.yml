name: Hunt Leads Daily

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install anthropic
      - name: Hunt leads
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/hunt_leads.py
      - name: Commit leads
        run: |
          git config user.name "LeadFlow Bot"
          git config user.email "bot@leadflow.ai"
          git add leads.json
          git diff --staged --quiet || git commit -m "Auto: leads updated $(date +%Y-%m-%d)"
          git push
