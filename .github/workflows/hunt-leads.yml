name: Hunt Leads Daily

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini FREE
        run: pip install google-generativeai
      - name: Hunt WizoLabs international leads
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/hunt_leads.py
      - name: Save leads to repo
        run: |
          git config user.name "WizoLabs Bot"
          git config user.email "bot@wizolabs.com"
          git add leads.json
          git diff --staged --quiet || git commit -m "WizoLabs: leads updated $(date +%Y-%m-%d)"
          git push
